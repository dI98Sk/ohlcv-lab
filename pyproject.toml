[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohlcv-lab"
version = "0.1.0"
description = "Market data pipeline: Bybit API -> raw JSON -> clean Parquet -> SQL -> statistics and report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "duckdb>=1.0",
    "polars>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbstripout>=0.7",
]

[project.scripts]
ohlcv-fetch = "ohlcv_lab.fetch:main"
ohlcv-clean = "ohlcv_lab.clean:main"
ohlcv-stats = "ohlcv_lab.stats:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
